<!doctype html>
	<html>

			<style>
				body {
					background: white;
					font-family: 'Nunito Sans';
				}
				.greenDisplay {
					display: flex;

					<body>
						
						<div class='greenDisplay'>
							<h1 class='green-display-text'>Тут будет твой результат</h1>
						</div>
						<h1 class='Name-caption'>
							Результат(Не является медицинским диагнозом)
						</h1>
						
						<p class='caption'>
							
						</p>
					<script>
						
						const resultText = document.querySelector('.green-display-text');
						
						const name = localStorage.getItem('name');
						const surname = localStorage.getItem('surname');
						const caption = document.querySelector('.caption');
						
						
						let first = Number(localStorage.getItem('firstQuest'));
						let second = Number(localStorage.getItem('secondQuest'));
						let three = Number(localStorage.getItem('threeQuest'));
						let four = Number(localStorage.getItem('fourQuest'));
						let five = Number(localStorage.getItem('fiveQuest'));
						let six = Number(localStorage.getItem('sixQuest'));
						let seven = Number(localStorage.getItem('sevenQuest'));
						
						let total_count = first + second + three + four + five + six + seven;
						
						resultText.innerHTML = `${name} ${surname}<br>Баллов: ${total_count} из 21`;

let level, description, recommendations;

if (total_count <= 4) {
    level = 'Минимальная тревожность';
    description = 'Ваш результат находится в пределах нормы. Выраженных признаков тревожного расстройства не обнаружено. Эмоциональный фон стабилен, вы справляетесь с повседневными задачами без значительного напряжения.';
} else if (total_count <= 9) {
    level = 'Лёгкая тревожность';
    description = 'У вас присутствуют отдельные признаки тревоги, но они не мешают повседневной жизни. Возможно, вы стали чаще переживать по пустякам или замечаете лёгкое напряжение. Это нормальная реакция на стресс, но за ней стоит следить.';
} else if (total_count <= 14) {
    level = 'Средняя тревожность';
    description = 'У вас заметные признаки тревожности, которые могут влиять на сон, концентрацию и общее самочувствие. Возможно, вы часто чувствуете напряжение, трудно расслабиться, а мысли возвращаются к тревожным сценариям.';
} else {
    level = 'Высокая тревожность';
    description = 'У вас выраженные признаки тревожности. Такое состояние может серьёзно влиять на качество жизни: мешать работе, учёбе, отношениям, вызывать проблемы со сном и физическим здоровьем. Это не «слабость» — это состояние, с которым можно и нужно работать.';
}

caption.innerHTML = `
    <strong>${level}</strong><br><br>
    ${description}<br><br>
    <strong>Что делать:</strong><br>
    <small>Тест носит ознакомительный характер и не заменяет консультацию специалиста.</small>
`;
